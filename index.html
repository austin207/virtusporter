<!DOCTYPE html>
<!-- Palette switch: data-palette="graphite" (graphite + Virtus red) | "oxigen-teal". Tokens: src/styles/theme.css -->
<html lang="en-IN" data-palette="graphite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Progressive enhancement flags (before first paint): reveal animations only hide content
      // when JS runs; the intro preloader shows once per session.
      (function (d) {
        d.classList.add('js');
        try { if (sessionStorage.getItem('vc-seen')) d.classList.add('seen'); } catch (e) {}
      })(document.documentElement);
    </script>
    <!--app-head-->
    <title>VirtusCo | Robotics Engineering Company in Kochi, India</title>
    <meta name="description" content="VirtusCo builds custom robots in Kochi, India: ROS development, mechanical and electronics design, system integration and AI, scoped to your budget." />
    <!--/app-head-->

    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="VirtusCo" />
    <meta name="apple-mobile-web-app-title" content="VirtusCo" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32" />
